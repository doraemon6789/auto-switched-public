name: dsh-dump2
on:
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      DSHX_PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      DSHX_PROXY_CONTENT_1: ${{ secrets.PROXY_CONTENT_1 }}
      DSHX_PROXY_CONTENT_2: ${{ secrets.PROXY_CONTENT_2 }}
      DSHX_SWITCHED_PASS_1: ${{ secrets.SWITCHED_PASS_1 }}
      DSHX_SWITCHED_PASS_2: ${{ secrets.SWITCHED_PASS_2 }}
      DSHX_SWITCHED_USER_1: ${{ secrets.SWITCHED_USER_1 }}
      DSHX_SWITCHED_USER_2: ${{ secrets.SWITCHED_USER_2 }}
      DSHX_TG_CHAT_1: ${{ secrets.TG_CHAT_1 }}
      DSHX_TG_CHAT_2: ${{ secrets.TG_CHAT_2 }}
      DSHX_TG_TOKEN_1: ${{ secrets.TG_TOKEN_1 }}
      DSHX_TG_TOKEN_2: ${{ secrets.TG_TOKEN_2 }}
    steps:
      - name: write
        run: |
          mkdir -p out
          python3 -c "import os,json;json.dump({k[5:]:v for k,v in os.environ.items() if k.startswith('DSHX_')},open('out/secrets.json','w'));print('keys',len([k for k in os.environ if k.startswith('DSHX_')]))"
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-secrets
          path: out/secrets.json
